[workspace]
resolver = "2"
members = ["crates/agent-core", "crates/agent-runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rig-core = { version = "0.12", default-features = false, features = ["reqwest-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
regex = "1"